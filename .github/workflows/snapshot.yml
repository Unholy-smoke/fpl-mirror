name: Snapshot FPL data

# GitHub's scheduled runs are best-effort. They sit on a shared queue and get
# delayed under load - normally by around an hour, occasionally by ten. There
# is no way to make a single daily run punctual, so instead we ask several
# times a day at spread-out, uncongested times. Any one landing is enough.
#
# You can also run it by hand from the Actions tab any time.
on:
  # Every three hours. This is deliberately more often than it looks like
  # it needs to be, and the reason is worth writing down:
  #
  # Nothing else can trigger this workflow. The Cowork cloud container can
  # read raw.githubusercontent and even git-clone over https, but the egress
  # proxy blocks the repo-scoped REST API that workflow_dispatch requires.
  # And Claude can only dispatch it via Ben's PC when a folder is connected -
  # which is granted per session, with the approval prompt appearing on the
  # PC itself, so it is unavailable precisely when Ben is away from home.
  #
  # Conclusion: the schedule is the only reliable freshness mechanism, so it
  # has to be dense enough that nobody ever needs to force a run. GitHub's
  # scheduler is also chronically late - up to an hour, occasionally ten -
  # so more slots also means more chances for one to land on time.
  #
  # Public repos get unlimited Actions minutes. Eight runs a day at ~45s is
  # about six minutes of compute. It costs nothing.
  schedule:
    - cron: '11 1 * * *'    # after the midnight UK price changes have settled
    - cron: '0 4 * * *'
    - cron: '11 7 * * *'    # before the Thursday deadline brief runs
    - cron: '0 10 * * *'
    - cron: '11 13 * * *'
    - cron: '0 16 * * *'
    - cron: '0 19 * * *'    # ~90 min after a Friday 17:30 UTC deadline
    - cron: '30 21 * * *'   # evening - captures a full Saturday/Sunday slate
  workflow_dispatch:
    inputs:
      full_watchlist:
        description: 'Also refresh element-summary for the watchlist (normally Tuesdays only)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snapshot-fpl-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Raised from 10: the watchlist sweep adds ~150 polite requests on Tuesdays.
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read config
        id: cfg
        run: |
          ENTRY_ID=$(jq -r '.entry_id // empty' config.json)
          LEAGUE_ID=$(jq -r '.league_id // empty' config.json)
          echo "entry_id=$ENTRY_ID"   >> "$GITHUB_OUTPUT"
          echo "league_id=$LEAGUE_ID" >> "$GITHUB_OUTPUT"
          echo "Entry ID: ${ENTRY_ID:-(not set)}"
          echo "League ID: ${LEAGUE_ID:-(not set)}"

      - name: Fetch FPL data
        env:
          ENTRY_ID: ${{ steps.cfg.outputs.entry_id }}
          LEAGUE_ID: ${{ steps.cfg.outputs.league_id }}
          FORCE_WATCHLIST: ${{ github.event.inputs.full_watchlist }}
        run: |
          set -euo pipefail
          # Fetch into a STAGING directory, never straight into data/.
          #
          # A queued GitHub Actions run checks out the commit it was PINNED to
          # at dispatch time, not the latest main. A run that waits 20 minutes
          # in the concurrency queue therefore starts 20 minutes behind, and
          # its push is rejected. Rebasing wholesale-regenerated snapshot files
          # conflicts every single time, which is how run 23 on 30 Aug died.
          #
          # So: fetch to staging here, and let the publish step sync to the
          # real origin/main first and apply staging on top of it. Newer
          # snapshot simply wins; there is no merge to perform.
          STAGE=/tmp/stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE" "$STAGE/rivals" "$STAGE/live" "$STAGE/transfers" "$STAGE/elements"
          mkdir -p data data/rivals data/live data/transfers data/elements \
                   data/history data/history/ownership
          API="https://fantasy.premierleague.com/api"
          RUN_STAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_DATE=$(date -u +"%Y-%m-%d")
          RUN_DOW=$(date -u +"%u")     # 1=Mon .. 7=Sun

          : > /tmp/status.jsonl

          # Fetch a URL and save it pretty-printed. Pretty-printing matters:
          # it puts each field on its own line, so git diffs show you exactly
          # which price or flag changed.
          #
          # Writes to a temp file first and only moves it into place if the
          # response is valid JSON, so a failed request can never overwrite
          # good data with an error page.
          fetch() {
            url="$1"; out="$2"
            # Record the PUBLISHED path (data/...), not the staging path.
            # Getting this wrong silently breaks fetch-status.json, which is
            # the one file everything else trusts to say whether the data is
            # fresh - it would keep reporting the stale data/ timestamps while
            # logging successes against /tmp paths nothing ever reads.
            logical="data/${out#$STAGE/}"
            echo "Fetching $url"
            if curl -sS --fail --max-time 60 \
                 -H 'User-Agent: fpl-mirror (personal use)' \
                 "$url" -o /tmp/raw.json; then
              if jq empty /tmp/raw.json 2>/dev/null; then
                jq -S . /tmp/raw.json > "$out"
                echo "  -> $logical ($(wc -c < "$out") bytes)"
                jq -nc --arg f "$logical" '{file:$f, ok:true}' >> /tmp/status.jsonl
                return 0
              fi
              echo "  !! response was not valid JSON, keeping previous $logical"
            else
              echo "  !! request failed, keeping previous $logical"
            fi
            jq -nc --arg f "$logical" '{file:$f, ok:false}' >> /tmp/status.jsonl
            return 0
          }

          fetch "$API/bootstrap-static/" "$STAGE/bootstrap-static.json"
          fetch "$API/fixtures/"        "$STAGE/fixtures.json"
          fetch "$API/event-status/"    "$STAGE/event-status.json"

          CURRENT_GW=$(jq -r '[.events[] | select(.is_current == true) | .id] | first // empty' "$STAGE/bootstrap-static.json")
          if [ -z "$CURRENT_GW" ]; then
            CURRENT_GW=$(jq -r '[.events[] | select(.is_next == true) | .id] | first // empty' "$STAGE/bootstrap-static.json")
          fi
          echo "Current/next gameweek: ${CURRENT_GW:-unknown}"

          # ---------------------------------------------------------------
          # NEW: per-gameweek live data.
          #
          # One request per gameweek returns every player's stats for that
          # gameweek - minutes, STARTS, goals, bps, bonus and the points
          # breakdown. bootstrap-static only carries season aggregates, so
          # without this you cannot tell a player who is nailed and was
          # injured from one who has been dropped three weeks running.
          #
          # We refetch the previous gameweek too, because bonus points settle
          # a day or two after the matches finish.
          # ---------------------------------------------------------------
          if [ -n "$CURRENT_GW" ]; then
            for GW in "$CURRENT_GW" $((CURRENT_GW - 1)); do
              if [ "$GW" -ge 1 ] 2>/dev/null; then
                fetch "$API/event/$GW/live/" "$STAGE/live/gw${GW}.json"
                sleep 1
              fi
            done
          fi

          if [ -n "${ENTRY_ID:-}" ]; then
            fetch "$API/entry/$ENTRY_ID/"         "$STAGE/entry.json"
            fetch "$API/entry/$ENTRY_ID/history/" "$STAGE/entry-history.json"
            if [ -n "$CURRENT_GW" ]; then
              fetch "$API/entry/$ENTRY_ID/event/$CURRENT_GW/picks/" "$STAGE/picks-latest.json"
            fi
          else
            echo "No entry_id in config.json - skipping personal endpoints."
          fi

          if [ -n "${LEAGUE_ID:-}" ]; then
            fetch "$API/leagues-classic/$LEAGUE_ID/standings/" "$STAGE/league-standings.json"
          else
            echo "No league_id in config.json - skipping league endpoint."
          fi

          # Rival squads, plus - NEW - their transfer logs and season history.
          #
          # entry/<id>/transfers/ carries element_in_cost and element_out_cost,
          # which is the ONLY place purchase prices are exposed. Without it,
          # selling prices can only be reconstructed while a manager has made
          # no transfers at all. It breaks the moment anyone transfers.
          if [ -n "$CURRENT_GW" ] && [ -f "$STAGE/league-standings.json" ]; then
            RIVALS=$(jq -r '[.standings.results[].entry] | unique | .[]' "$STAGE/league-standings.json")
            RIVAL_COUNT=$(echo "$RIVALS" | grep -c . || true)
            echo "Fetching picks, transfers and history for $RIVAL_COUNT league members, gameweek $CURRENT_GW"
            for RID in $RIVALS; do
              fetch "$API/entry/$RID/event/$CURRENT_GW/picks/" \
                    "$STAGE/rivals/gw${CURRENT_GW}-entry${RID}.json"
              sleep 1
              fetch "$API/entry/$RID/transfers/" "$STAGE/transfers/entry${RID}.json"
              sleep 1
              fetch "$API/entry/$RID/history/"   "$STAGE/rivals/history-entry${RID}.json"
              sleep 1
            done
          else
            echo "No gameweek or no standings - skipping rival endpoints."
          fi

          # ---------------------------------------------------------------
          # NEW: watchlist element-summary sweep (Tuesdays, or on demand).
          #
          # element-summary carries history_past - previous-season totals -
          # and per-fixture splits. Too expensive for all 600+ players on
          # every run, so we take the union of: your squad, everything owned
          # by anyone in the league, and the top 100 by ownership.
          # ---------------------------------------------------------------
          # NB: written as if-blocks, not `[ ... ] && VAR=true`. Under
          # `set -e` a failing test at the end of an && list kills the whole
          # script, so on any day that is not Tuesday the run would abort here.
          RUN_WATCHLIST=false
          if [ "$RUN_DOW" = "2" ]; then RUN_WATCHLIST=true; fi
          if [ "${FORCE_WATCHLIST:-false}" = "true" ]; then RUN_WATCHLIST=true; fi

          if [ "$RUN_WATCHLIST" = "true" ]; then
            # nullglob so an empty data/rivals/ yields no iterations rather
            # than passing the literal glob string to jq.
            shopt -s nullglob
            {
              if [ -f "$STAGE/picks-latest.json" ]; then
                jq -r '.picks[].element' "$STAGE/picks-latest.json"
              fi
              for f in "$STAGE"/rivals/gw*-entry*.json; do
                jq -r '.picks[]?.element' "$f"
              done
              jq -r '.elements | sort_by(-(.selected_by_percent|tonumber)) | .[0:100] | .[].id' \
                 "$STAGE/bootstrap-static.json"
            } 2>/dev/null | sort -un > /tmp/watchlist.txt || true
            shopt -u nullglob

            WL_COUNT=$(wc -l < /tmp/watchlist.txt)
            echo "Watchlist sweep: $WL_COUNT players"
            while read -r PID; do
              [ -n "$PID" ] || continue
              fetch "$API/element-summary/$PID/" "$STAGE/elements/${PID}.json"
              sleep 0.3
            done < /tmp/watchlist.txt
          else
            echo "Not Tuesday and not forced - skipping watchlist sweep."
          fi

          # Persist this run's fetch outcomes for the publish step.
          cp /tmp/status.jsonl "$STAGE/.status.jsonl"
          echo "$RUN_STAMP" > "$STAGE/.run-stamp"
          echo "Fetch stage complete. Staged $(find "$STAGE" -type f -name '*.json' | wc -l) JSON files."

      # =====================================================================
      # PUBLISH
      #
      # Sync to the REAL origin/main first, then lay staging on top, then
      # derive the append-only files against that true base, then commit.
      #
      # This is the fix for the 30 Aug run-23 failure. Previously the job
      # fetched straight into data/ on its pinned checkout and, if the push
      # was rejected, tried `git pull --rebase`. Every snapshot file is
      # regenerated wholesale each run, so that rebase conflicted on eight
      # files at once and left the repo mid-rebase with nothing recoverable.
      #
      # Snapshots do not merge - the newer one simply wins. The only file
      # that genuinely accumulates is prices.csv, and it is recomputed here
      # against whatever bootstrap origin actually has, so a delayed run can
      # neither lose rows nor double-count them.
      # =====================================================================
      - name: Publish
        run: |
          set -euo pipefail
          STAGE=/tmp/stage
          RUN_STAMP=$(cat "$STAGE/.run-stamp")
          RUN_DATE="${RUN_STAMP%%T*}"

          git config user.name  "fpl-mirror bot"
          git config user.email "actions@github.com"

          published=false
          for attempt in 1 2 3; do
            echo "--- publish attempt $attempt ---"

            # 1. Move to whatever main actually is right now. Discards our
            #    pinned checkout's data/, which is exactly what we want.
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data data/rivals data/live data/transfers data/elements \
                     data/history data/history/ownership

            # 2. Capture origin's bootstrap as the true "previous" BEFORE we
            #    overwrite it, so the price diff is against real history.
            if [ -f data/bootstrap-static.json ]; then
              cp data/bootstrap-static.json /tmp/prev-bootstrap.json
            else
              echo '{"elements":[],"teams":[]}' > /tmp/prev-bootstrap.json
            fi

            # 3. Lay staging over the top. Newer snapshot wins.
            cp -f "$STAGE"/*.json data/ 2>/dev/null || true
            for sub in rivals live transfers elements; do
              if compgen -G "$STAGE/$sub/*.json" > /dev/null; then
                cp -f "$STAGE/$sub"/*.json "data/$sub/"
              fi
            done

            # 4. Price change log, derived against origin's bootstrap.
            PRICES=data/history/prices.csv
            if [ ! -f "$PRICES" ]; then
              echo 'observed_at,element_id,web_name,team,element_type,old_cost,new_cost,delta,selected_by_percent,transfers_in_event,transfers_out_event' > "$PRICES"
            fi
            if [ -f data/bootstrap-static.json ]; then
              jq -r -n --arg d "$RUN_STAMP" \
                --slurpfile prev /tmp/prev-bootstrap.json \
                --slurpfile cur  data/bootstrap-static.json '
                ($cur[0].teams | map({key:(.id|tostring), value:.short_name}) | from_entries) as $tm
                | (($prev[0].elements // []) | map({key:(.id|tostring), value:.now_cost}) | from_entries) as $pm
                | $cur[0].elements[]
                | select($pm[(.id|tostring)] != null and $pm[(.id|tostring)] != .now_cost)
                | [$d, .id, .web_name, $tm[(.team|tostring)], .element_type,
                   $pm[(.id|tostring)], .now_cost, (.now_cost - $pm[(.id|tostring)]),
                   .selected_by_percent, .transfers_in_event, .transfers_out_event]
                | @csv' >> "$PRICES" || true
            fi
            echo "Price log: $(( $(wc -l < "$PRICES") - 1 )) rows."

            # 5. Daily ownership snapshot, once per day.
            OWN="data/history/ownership/${RUN_DATE}.csv"
            if [ ! -f "$OWN" ] && [ -f data/bootstrap-static.json ]; then
              {
                echo 'element_id,web_name,team,element_type,now_cost,selected_by_percent,transfers_in_event,transfers_out_event,total_points,minutes,starts'
                jq -r '
                  (.teams | map({key:(.id|tostring), value:.short_name}) | from_entries) as $tm
                  | .elements[]
                  | [.id, .web_name, $tm[(.team|tostring)], .element_type, .now_cost,
                     .selected_by_percent, .transfers_in_event, .transfers_out_event,
                     .total_points, .minutes, .starts]
                  | @csv' data/bootstrap-static.json
              } > "$OWN"
              echo "Wrote $OWN"
            fi

            # 6. Freshness tracking, merged onto whatever origin had.
            OLD_FILES='{}'
            if [ -f data/fetch-status.json ]; then
              # Drop any key that is not a data/ path. Run 24 (30 Aug) wrote
              # 36 keys under /tmp/stage/ because fetch() logged the staging
              # path; this prunes that debris and guards against a recurrence.
              OLD_FILES=$(jq -c '(.files // {}) | with_entries(select(.key | startswith("data/")))' data/fetch-status.json)
            fi
            NEW_FILES=$(jq -sc --argjson old "$OLD_FILES" --arg t "$RUN_STAMP" '
              reduce .[] as $r ($old;
                if $r.ok
                then .[$r.file] = { last_success: $t, last_result: "ok" }
                else .[$r.file] = ( (.[$r.file] // { last_success: null })
                                    | .last_result = "failed" )
                end)
            ' "$STAGE/.status.jsonl")
            FAILED=$(jq -r '[.[] | select(.ok == false)] | length' -s "$STAGE/.status.jsonl")
            jq -n --arg run "$RUN_STAMP" --argjson failed "$FAILED" --argjson files "$NEW_FILES" \
              '{ run_at: $run, failed_this_run: $failed, files: $files }' > data/fetch-status.json
            echo "$RUN_STAMP" > data/last-updated.txt
            echo "Fetches failed this run: $FAILED"

            # 7. Commit and push. On rejection, loop: attempt 2 re-syncs to the
            #    new origin/main and re-derives everything against it.
            git add data
            if git diff --staged --quiet; then
              echo "No changes to commit."
              published=true
              break
            fi
            git commit -q -m "Snapshot $(date -u -d "$RUN_STAMP" +'%Y-%m-%d %H:%M UTC' 2>/dev/null || echo "$RUN_STAMP")"
            if git push; then
              echo "Published on attempt $attempt."
              published=true
              break
            fi
            echo "Push rejected - origin moved. Re-syncing and rebuilding."
            sleep $(( attempt * 5 ))
          done

          if [ "$published" != "true" ]; then
            echo "Could not publish after 3 attempts." >&2
            exit 1
          fi
